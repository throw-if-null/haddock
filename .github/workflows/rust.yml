name: Rust

# The Rust port of the checker. It runs only when the crate or one of its build files
# changes. A pull request runs once, on the merge result. A push runs only on main, after a
# merge.
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/rust.yml

# An explicit shell runs each step with -e and -o pipefail. The default shell sets only -e.
defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-${{ vars.UBUNTU_VERSION }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit. The first parent of that commit is
          # the base branch, and the mutation check compares the two.
          fetch-depth: 2
      - name: Install the pinned tools
        # tests/run needs bats-core from mise.toml.
        uses: jdx/mise-action@v5
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # The version MUST match the channel in rust-toolchain.toml.
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: cargo build
        run: cargo build --release
      - name: Test suite against the release binary
        run: CHECK="$PWD/target/release/doc-style-check" tests/run
      - name: Print the processor count
        run: nproc
      - name: Mutation check
        # A pull request tests only the mutants in the lines that it changes. A push to main
        # tests every mutant.
        run: |
          TIMEFORMAT='cargo mutants took %0R seconds'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --stat HEAD^1 HEAD
            git diff HEAD^1 HEAD >"$RUNNER_TEMP/pull-request.diff"
            time cargo mutants --jobs "$(nproc)" --in-diff "$RUNNER_TEMP/pull-request.diff"
          else
            time cargo mutants --jobs "$(nproc)"
          fi

schema_version: "1.0"
name: historical-adr
description: >-
  The job queue moves to Redis. The agent updates the current-state architecture page, preserves the historical context of the accepted ADR, and follows the ADR convention.
tags: [history, adr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    queue.py now stores jobs in a Redis list instead of the PostgreSQL jobs table. We moved because each claim held a row lock until the job finished, and long jobs exhausted the database connection pool. Production now runs Redis. Update the documentation to match.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?doc-style"'
    arm: with-only
  - name: adr-context-kept
    type: regex
    pattern: 'Redis is not available in production'
    target: {source: file, path: docs/adr/0004-store-jobs-in-postgresql.md}
  - name: adr-decision-kept
    type: regex
    pattern: 'Store jobs in the `jobs` table\.'
    target: {source: file, path: docs/adr/0004-store-jobs-in-postgresql.md}
  - name: adr-superseded
    type: regex
    pattern: 'Status: Superseded'
    target: {source: file, path: docs/adr/0004-store-jobs-in-postgresql.md}
  - name: architecture-not-stale
    type: regex
    pattern: 'Jobs are stored in the PostgreSQL'
    match: not_contains
    target: {source: file, path: docs/architecture.md}
  - name: architecture-current
    type: llm
    focus: {source: file, path: docs/architecture.md}
    criteria: >-
      The Job queue section describes the Redis list as the current design. It does not
      narrate the change: it does not use "previously", "used to", "was moved", "migrated",
      "replaced", or "no longer" to describe the queue. It may link to ADRs for the decision
      history. It does not state that jobs are stored in the PostgreSQL jobs table.
